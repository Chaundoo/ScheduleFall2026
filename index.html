<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fall Weekly Schedule & Quota Planner</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --class-color: #3b82f6;
      --capstone-fixed: #6366f1;
      --gym-color: #ef4444;
      --quota-capstone: #8b5cf6;
      --quota-intern: #10b981;
      --quota-hw: #f59e0b;
      --work-color: #06b6d4;
      --personal-color: #ec4899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px 12px 60px;
      line-height: 1.4;
      overflow-x: hidden;
    }

    .app-container {
      max-width: 980px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      background: var(--panel);
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button.action-btn {
      background: #334155;
      color: var(--text);
      border: 1px solid #475569;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.78rem;
      transition: all 0.15s ease;
    }

    button.action-btn:hover {
      background: #475569;
    }

    button.action-btn.primary {
      background: #2563eb;
      border-color: #3b82f6;
    }

    button.action-btn.primary:hover {
      background: #1d4ed8;
    }

    button.action-btn.success {
      background: #059669;
      border-color: #10b981;
    }

    button.action-btn.success:hover {
      background: #047857;
    }

    button.action-btn.danger:hover {
      background: #dc2626;
      border-color: #ef4444;
    }

    /* Save / Load & Week Date Bar */
    .sync-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sync-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .sync-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .sync-label {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

    .code-input {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-family: monospace;
      min-width: 210px;
      flex: 1;
      user-select: text;
    }

    .date-picker-input {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 0.78rem;
      color-scheme: dark;
    }

    .toast-msg {
      font-size: 0.78rem;
      color: #4ade80;
      font-weight: 600;
      display: none;
    }

    /* Quota Dashboard */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .quota-card {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 10px;
    }

    .quota-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      transition: width 0.25s ease;
    }

    .quota-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 5px;
      display: flex;
      justify-content: space-between;
    }

    /* Palette Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--panel);
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      align-items: center;
    }

    .toolbar-label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      margin-right: 4px;
    }

    .tool-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border-radius: 8px;
      border: 2px solid transparent;
      background: #0f172a;
      color: var(--text);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      transition: transform 0.1s, border-color 0.15s;
    }

    .tool-btn.active {
      border-color: #f8fafc;
      background: #1e293b;
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Day View Selector Tabs */
    .day-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
      background: var(--panel);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .day-tab {
      flex: 1;
      min-width: 68px;
      text-align: center;
      padding: 6px 6px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: #0f172a;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .day-tab span.tab-date {
      font-size: 0.68rem;
      font-weight: 500;
      opacity: 0.85;
    }

    .day-tab.active {
      background: #3b82f6;
      color: #ffffff;
    }
